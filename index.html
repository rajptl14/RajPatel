    /* ==========================================================================
       1. ACADEMIC JOURNAL DESIGN SYSTEM & CSS VARIABLES
       ========================================================================== */
    :root {
      /* Colors: Paper tone palette */
      --paper: #F8F7F0;
      --paper-rgb: 248, 247, 240;
      --panel: #EFECE1;
      --panel-hover: #E7E3D5;
      --ink: #181C16;
      --ink-soft: #4F554A;
      --ink-muted: #73786D;
      --rule: #D1CDBC;
      --rule-light: #E2DFD2;

      /* Accents */
      --accent-teal: #0D7366;
      --accent-teal-deep: #085249;
      --accent-oxblood: #8C3B2F;
      --scholar-blue: #1a0dab;
      --scholar-green: #006621;

      /* Layout & Typography */
      --max-width: 1040px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --font-display: 'Fraunces', serif;
      --font-serif: 'Source Serif 4', serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    html[data-theme="dark"] {
      --paper: #11140E;
      --paper-rgb: 17, 20, 14;
      --panel: #1A1E16;
      --panel-hover: #23281E;
      --ink: #EAE7DC;
      --ink-soft: #A2A695;
      --ink-muted: #73786B;
      --rule: #323725;
      --rule-light: #24291B;

      --accent-teal: #3FC4B0;
      --accent-teal-deep: #63D9C7;
      --accent-oxblood: #D48479;
      --scholar-blue: #8ab4f8;
      --scholar-green: #81c995;
    }

    /* Base Setup */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 1rem;
      line-height: 1.65;
      transition: background-color 0.25s ease, color 0.25s ease;
      padding-bottom: 60px;
    }

    a { color: inherit; text-decoration: none; }
    .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }
    .mono { font-family: var(--font-mono); }

    a:focus-visible, button:focus-visible {

      outline-offset: 3px;
    }

    .eyebrow {

      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-teal-deep);
      font-weight: 600;
    }

      font-family: var(--font-mono);
      font-size: 0.7rem;

      background: var(--panel);
      border: 1px solid var(--rule);
      color: var(--ink-soft);
      text-transform: uppercase;
    }
